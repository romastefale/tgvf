<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Verificador</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif;
           background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    button { width: 100%; padding: 12px; margin-bottom: 8px; border: 0; border-radius: 8px; font-size: 1rem;
             background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
    button:disabled { opacity: .5; }
    ul { list-style: none; padding: 0; margin: 16px 0 0; }
    li { padding: 8px 0; border-bottom: 1px solid var(--tg-theme-hint-color, #ccc); word-break: break-word; }
    .error { color: var(--tg-theme-destructive-text-color, #d33); }
  </style>
</head>
<body>
  <h1>Verificador</h1>
  <button id="verify">Verificar perfil e bots</button>
  <button id="unverify">Remover verificações</button>
  <ul id="out"></ul>

  <script>
    var tg = Telegram.WebApp;
    tg.ready();

    var out = document.getElementById('out');
    var buttons = [document.getElementById('verify'), document.getElementById('unverify')];

    function show(text, isError) {
      var li = document.createElement('li');
      li.textContent = text;
      if (isError) li.className = 'error';
      out.appendChild(li);
    }

    // Serverless.call(name, callback): error é null em caso de sucesso; senão traz
    // message, type ('ENDPOINT_ERROR' quando o endpoint lançou EndpointError), status e parameters.
    function call(name) {
      out.textContent = '';
      buttons.forEach(function (b) { b.disabled = true; });
      tg.Serverless.call(name, function (error, results) {
        buttons.forEach(function (b) { b.disabled = false; });
        if (error) {
          var problem = error.parameters && error.parameters.problem;
          show(error.message + (problem ? ': ' + problem : ''), true);
          return;
        }
        results.forEach(function (r) {
          show(r.ok ? 'OK | ' + r.label : 'FALHOU | ' + r.label + ': ' + r.detail, !r.ok);
        });
      });
    }

    buttons[0].addEventListener('click', function () { call('verify'); });
    buttons[1].addEventListener('click', function () { call('unverify'); });
  </script>
</body>
</html>
