name: Deploy (Telegram Serverless)

# Cada push na main que altera o bot publica os módulos e o Mini App (`tgcloud push`).
# O token do Serverless (BotFather → bot → Serverless → CLI Access → Access token,
# formato app<id>:<secret>) está no secret KEY1 e é entregue à CLI como TGCLOUD_TOKEN,
# que é a variável documentada para CI. NÃO é o token da Bot API.

on:
  push:
    branches: [main]
    paths:
      - "tgcloud/**"
      - "scripts/**"
      - "app/**"
      - "tgcloud.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.KEY1 }}
      OWNER: ${{ vars.OWNER || secrets.OWNER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # CLI oficial @tgcloud/cli em versão fixa, instalada localmente.
      - run: npm install --no-audit --no-fund

      # O estado local (.tgcloud/) não existe no runner; `fetch` baixa o estado da nuvem
      # para o `push` saber em qual revisão está se baseando.
      - name: Sincronizar estado da nuvem
        run: npm run fetch

      # O runtime não lê variáveis de ambiente: o dono é gravado em config.js antes do push.
      - name: Gravar configuração (OWNER)
        run: node scripts/apply-config.mjs

      - name: Mudanças a publicar
        run: npm run status

      - name: Publicar módulos e Mini App
        run: npm run deploy

      # `migrate` sem flag exige terminal interativo e falha em CI. Com --safe aplica só mudanças
      # aditivas (tabela, coluna ou índice novos) e ignora as destrutivas; --yes não é usado.
      - name: Migrar banco
        run: npm run migrate -- --safe

      - name: Estado do webhook
        run: npm run webhook
